[project]
name = "autonomous-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nadula Pathirana", email = "nadulapathirana2010@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "onnxruntime<1.24",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=3,<5",
    "streamlit>=1.67.0",
    "torch==2.4.1",
    "transformers>=4.44,<5",
]

[project.scripts]
autonomous-rag = "autonomous_rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
